# Builds, tests and scans everything shipped by the project, called by ci.yml
# and release.yml:
#
#   docs      the PDF manuals
#   packages  the RPM and DEB packages of the supported distributions, after
#             the tests of the filter, with their CycloneDX SBOM
#   install   the installation of each package on its distribution
#   image     the container image, from the Debian 13 package, and the same
#             image with bash and curl (tags with "-debug"), checked with
#             the default security settings of Kubernetes and OpenShift,
#             scanned, and pushed, signed and attested when "publish" is set
#
# When "publish" is set, the RPM packages are signed with the GPG key of the
# PKG_GPG_PRIVATE_KEY secret if there is one, and all packages are attested
# (SLSA provenance and SBOM).
#
# The deps stage of the Containerfile, which takes about an hour, is cached in
# the registry, per distribution.

name: build

on:
  workflow_call:
    inputs:
      version:
        description: version of the packages
        type: string
        required: true
      publish:
        description: sign and attest the packages, push, sign and attest the image
        type: boolean
        default: false
      image-tags:
        description: tags of the image (docker/metadata-action syntax)
        type: string
        default: type=sha
    secrets:
      PKG_GPG_PRIVATE_KEY:
        description: armored private key signing the RPM packages (optional)
        required: false
      PKG_GPG_PASSPHRASE:
        required: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CACHE: ghcr.io/${{ github.repository }}/cache
  # the cache is only written by the builds of the repository itself
  CACHE_WRITE: ${{ github.event_name != 'pull_request' }}

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pandoc and typst
        env:
          PANDOC_VERSION: "3.11"
          PANDOC_SHA256: 37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6
          TYPST_VERSION: "0.15.0"
          TYPST_SHA256: 59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo pandoc.tar.gz "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  pandoc.tar.gz" | sha256sum -c -
          tar -xzf pandoc.tar.gz --strip-components=2 -C bin "pandoc-${PANDOC_VERSION}/bin/pandoc"
          curl -fsSLo typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz --strip-components=1 -C bin typst-x86_64-unknown-linux-musl/typst
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the PDF manuals
        run: |
          make pdf
          # an unclosed code block turns the "@..." words into citations
          for f in doc/*.md; do
            n=$(pandoc -t native "$f" | grep -c Cite || true)
            [ "$n" -eq 0 ] || { echo "::error file=$f::$n citations, unclosed code block?"; exit 1; }
          done
          ls -l build/*.pdf
          [ "$(find build -maxdepth 1 -name "*.pdf" | wc -l)" -eq 3 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manuals
          path: build/*.pdf
          if-no-files-found: error

  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write       # the build cache
      id-token: write       # the attestations
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dist: el8,         base: "docker.io/library/almalinux:8" }
          - { dist: el9,         base: "docker.io/library/almalinux:9" }
          - { dist: el10,        base: "docker.io/library/almalinux:10" }
          - { dist: deb12,       base: "docker.io/library/debian:bookworm" }
          - { dist: deb13,       base: "docker.io/library/debian:trixie" }
          - { dist: ubuntu22.04, base: "docker.io/library/ubuntu:22.04" }
          - { dist: ubuntu24.04, base: "docker.io/library/ubuntu:24.04" }
          - { dist: ubuntu26.04, base: "docker.io/library/ubuntu:26.04" }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: test
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.dist }}
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:{1},mode=max', env.CACHE, matrix.dist) || '' }}
          provenance: false
      - name: Package
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: packages
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            PKG_VERSION=${{ inputs.version }}
            CLOUDAUTH_COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=registry,ref=${{ env.CACHE }}:${{ matrix.dist }}
          outputs: type=local,dest=dist
          provenance: false
      - name: Sign the RPM package
        if: inputs.publish && startsWith(matrix.dist, 'el')
        env:
          KEY: ${{ secrets.PKG_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PKG_GPG_PASSPHRASE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::no PKG_GPG_PRIVATE_KEY secret, the RPM package is not signed"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y rpm
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$PASSPHRASE" > "$GNUPGHOME/passphrase"
          printf '%s\n' "$KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print $5; exit }')
          rpmsign --addsign --define "_gpg_name $keyid" \
            --define "_gpg_sign_cmd_extra_args --pinentry-mode loopback --passphrase-file $GNUPGHOME/passphrase" \
            dist/*.rpm
          gpg --armor --export "$keyid" > "$RUNNER_TEMP/key.asc"
          rpm --import "$RUNNER_TEMP/key.asc"
          rpm -K dist/*.rpm
          rm -rf "$GNUPGHOME"
      - name: Package file
        id: pkg
        run: echo "path=$(ls dist/*.rpm dist/*.deb 2>/dev/null)" >> "$GITHUB_OUTPUT"
      - name: Provenance attestation
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.path }}
      - name: SBOM attestation
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.path }}
          sbom-path: dist/haproxy-cloudauth-${{ matrix.dist }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.dist }}
          path: dist/*
          if-no-files-found: error

  install:
    needs: packages
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dist: el8,         image: "registry.access.redhat.com/ubi8/ubi" }
          - { dist: el9,         image: "registry.access.redhat.com/ubi9/ubi" }
          - { dist: el10,        image: "registry.access.redhat.com/ubi10/ubi" }
          - { dist: deb12,       image: "docker.io/library/debian:bookworm" }
          - { dist: deb13,       image: "docker.io/library/debian:trixie" }
          - { dist: ubuntu22.04, image: "docker.io/library/ubuntu:22.04" }
          - { dist: ubuntu24.04, image: "docker.io/library/ubuntu:24.04" }
          - { dist: ubuntu26.04, image: "docker.io/library/ubuntu:26.04" }
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-${{ matrix.dist }}
          path: dist
      - name: Install, check, upgrade and remove the package
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh /src/ci/install-test.sh /src/dist

  image:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: runtime,       suffix: "" }
          - { target: runtime-debug, suffix: "-debug" }
    permissions:
      contents: read
      packages: write         # the image and the build cache
      id-token: write         # the keyless signature and the attestations
      attestations: write
      security-events: write  # the scan results
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ inputs.image-tags }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          build-args: |
            PKG_VERSION=${{ inputs.version }}
            CLOUDAUTH_COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=registry,ref=${{ env.CACHE }}:deb13
          labels: ${{ steps.meta.outputs.labels }}
          tags: localhost/haproxy-cloudauth:test
          load: true
          provenance: false
      - name: Run with the default security settings of Kubernetes and OpenShift
        run: |
          # an arbitrary user of the group 0, as on OpenShift, without any
          # privilege, on a read-only root file system
          docker run -d --name hca -p 127.0.0.1:8080:8080 --user 1000650000:0 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            localhost/haproxy-cloudauth:test
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          docker logs hca
          curl -fsS http://127.0.0.1:8080/healthz
          docker stop hca
          [ "$(docker inspect -f '{{.State.ExitCode}}' hca)" -eq 0 ]
          docker run --rm --user 1001 --read-only --cap-drop ALL localhost/haproxy-cloudauth:test -vv
          if [ "${{ matrix.target }}" = runtime-debug ]; then
            docker run --rm localhost/haproxy-cloudauth:test bash -c 'curl -V | grep -w telnet'
          fi
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          # the SBOM of the package lists the libraries it ships
          SYFT_SELECT_CATALOGERS: +sbom-cataloger
        with:
          image: localhost/haproxy-cloudauth:test
          format: cyclonedx-json
          output-file: image${{ matrix.suffix }}.cdx.json
          upload-artifact: false
      - name: Scan
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: image${{ matrix.suffix }}.cdx.json
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: always() && steps.scan.outputs.sarif != '' && env.CACHE_WRITE == 'true'
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image${{ matrix.suffix }}
      - name: Push
        id: build
        if: inputs.publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          target: ${{ matrix.target }}
          build-args: |
            PKG_VERSION=${{ inputs.version }}
            CLOUDAUTH_COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          cache-from: type=registry,ref=${{ env.CACHE }}:deb13
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.publish
      - name: Sign
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Provenance attestation
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: image${{ matrix.suffix }}.cdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image${{ matrix.suffix }}-sbom
          path: image${{ matrix.suffix }}.cdx.json

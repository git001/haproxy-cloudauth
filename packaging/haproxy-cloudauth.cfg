# Example configuration of HAProxy with the cloudauth filter. It only answers
# on port 8080, see the commented example below to send the requests to a
# storage, and doc/configuration.md for the filter.
#
# HAProxy runs as an unprivileged user, so there is no "user", "group" or
# "chroot" here. The secrets referenced with "env:" are set in the environment
# file of the service, or in the environment of the container.

global
    # the filter and the cloudauth sections are experimental, uncomment with
    # the example below
    # expose-experimental-directives
    log stderr format short daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend main
    bind :8080
    http-request return status 200 content-type text/plain string "ready\n" if { path /healthz }
    default_backend no-storage

backend no-storage
    http-request return status 503 content-type text/plain string "no storage configured\n"

# An Amazon S3 bucket, with an access key read from the environment, which
# needs "expose-experimental-directives" in the global section:
#
# cloudauth s3-key
#     provider s3
#     signer sigv4
#     region eu-west-1
#     token env:AWS_ACCESS_KEY_ID env:AWS_SECRET_ACCESS_KEY
#
# backend s3
#     http-request normalize-uri path-strip-dotdot full
#     http-request set-path /mybucket%[path]
#     filter-config cloudauth enabled profile s3-key host s3.eu-west-1.amazonaws.com
#     server s3 s3.eu-west-1.amazonaws.com:443 ssl verify required ca-file @system-ca

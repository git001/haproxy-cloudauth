# Publishes a release for a "v<version>" tag: the packages of all the supported
# distributions, signed and attested, with their SBOMs in CycloneDX and SPDX,
# the PDF manuals, the checksums of all of them, signed, and the image, pushed
# with the tags of the version, signed and attested. The SBOMs are scanned
# for vulnerabilities, a critical one with a fix stops the release.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([~.][0-9A-Za-z.]+)?$' || {
            echo "::error::invalid version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      publish: true
      image-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest

  release:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # the release
      id-token: write       # the keyless signature and the attestations
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{package-*,manuals,image-sbom,image-debug-sbom}"
          path: dist
          merge-multiple: true
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: SPDX SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          cd dist
          # the checksums of the packages, only used by the image build
          rm -f ./*.sha256
          mv image.cdx.json haproxy-cloudauth-image.cdx.json
          mv image-debug.cdx.json haproxy-cloudauth-image-debug.cdx.json
          for f in *.cdx.json; do
            "$SYFT" convert "$f" -o "spdx-json=${f%.cdx.json}.spdx.json"
          done
          ls -l
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype
      - name: Scan the SBOMs
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          for f in dist/*.cdx.json; do
            echo "=== $f"
            "$GRYPE" "sbom:$f" --only-fixed --fail-on critical
          done
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums
        env:
          KEY: ${{ secrets.PKG_GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PKG_GPG_PASSPHRASE }}
        run: |
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          if [ -n "$KEY" ]; then
            export GNUPGHOME="$RUNNER_TEMP/gnupg"
            mkdir -m 700 "$GNUPGHOME"
            printf '%s' "$PASSPHRASE" > "$GNUPGHOME/passphrase"
            printf '%s\n' "$KEY" | gpg --batch --import
            gpg --batch --pinentry-mode loopback --passphrase-file "$GNUPGHOME/passphrase" \
              --armor --detach-sign SHA256SUMS
            gpg --armor --export > RPM-GPG-KEY-haproxy-cloudauth
            rm -rf "$GNUPGHOME"
          fi
      - name: Provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Container images: \`ghcr.io/${REPO}:${VERSION}\`, and
          \`ghcr.io/${REPO}:${VERSION}-debug\` with bash and curl.

          Verify the downloaded files and the image:

          \`\`\`
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify <file> --repo ${REPO}
          gh attestation verify oci://ghcr.io/${REPO}:${VERSION} --repo ${REPO}
          cosign verify ghcr.io/${REPO}:${VERSION} \\
            --certificate-identity-regexp "^https://github.com/${REPO}/" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md \
            --verify-tag dist/*
